name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release, an old-style tag, and the newest at time of writing.
        iso-codes: ["3.67", "4.7.0", "4.20.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build javadoc exportOutput -PisoCodesVersion=${{ matrix.iso-codes }}
      - uses: actions/upload-artifact@v7
        with:
          name: generated-iso-codes-${{ matrix.iso-codes }}
          path: build/output/
