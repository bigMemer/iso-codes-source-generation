name: Propose output update

# Generates sources for one iso-codes release and opens a pull request against the output repo
# (bigMemer/iso-codes-java) proposing them. Nothing is ever pushed to the output repo's main branch.

on:
  workflow_dispatch:
    inputs:
      iso-codes-version:
        description: "iso-codes release to generate (leave blank for the newest upstream release)"
        required: false

permissions:
  contents: read

env:
  OUTPUT_REPO: bigMemer/iso-codes-java

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          REQUESTED: ${{ inputs.iso-codes-version }}
        run: echo "version=${REQUESTED:-$(python3 scripts/upstream_versions.py --latest)}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build javadoc exportOutput -PisoCodesVersion=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: generated-iso-codes-${{ steps.version.outputs.version }}
          path: build/output/

  open-pr:
    needs: generate
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.generate.outputs.version }}
    steps:
      # TODO(cross-repo auth): this job needs a token that can push a branch to, and open a pull request on,
      # ${{ env.OUTPUT_REPO }}. The default GITHUB_TOKEN only covers this repo. The mechanism (fine-grained PAT
      # stored as a secret, or a GitHub App token) has deliberately not been chosen yet. Replace this step with
      # one that sets `outputs.token`; the steps below already use it.
      - name: Get a token for the output repo (TODO)
        id: auth
        run: |
          echo "::error::Cross-repo auth for $OUTPUT_REPO is not set up yet. See the TODO in propose-update.yml."
          exit 1

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.OUTPUT_REPO }}
          token: ${{ steps.auth.outputs.token }}
          path: output
      - uses: actions/download-artifact@v8
        with:
          name: generated-iso-codes-${{ env.VERSION }}
          path: generated

      - name: Replace generated files
        run: |
          mkdir -p output/src/main/java
          rsync -a --delete generated/src/main/java/ output/src/main/java/
          cp generated/iso-codes.version output/iso-codes.version

      - name: Open or update pull request
        working-directory: output
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Output repo already matches iso-codes $VERSION; nothing to propose."
            exit 0
          fi
          branch="iso-codes/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "Regenerate from iso-codes $VERSION" \
            -m "Generated by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push --force origin "$branch"
          if gh pr view "$branch" --repo "$OUTPUT_REPO" >/dev/null 2>&1; then
            echo "Updated existing pull request for $branch."
          else
            gh pr create --repo "$OUTPUT_REPO" --base main --head "$branch" \
              --title "Regenerate from iso-codes $VERSION" \
              --body "Generated sources for Debian iso-codes $VERSION by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          fi
